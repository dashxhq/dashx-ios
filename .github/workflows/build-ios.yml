name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Package.swift ships binary targets (DashX, DashXNotificationServiceExtension)
      # so consumers don't collide on Apollo. Build DashXFirebase to confirm
      # the source target still compiles against the binary DashX.
      - name: Build DashXFirebase (SPM, source, against binary DashX)
        run: xcodebuild -scheme DashXFirebase -destination 'generic/platform=iOS' build

      # Tests live in build-project/DashX.xcodeproj rather than a `.testTarget`
      # in Package.swift because binary SPM targets can't satisfy `@testable
      # import`. The Debug config of this xcodeproj builds the same Sources/**
      # with ENABLE_TESTABILITY=YES. The DashXTests scheme aggregates both
      # DashXTests and DashXNotificationServiceExtensionTests bundles.
      # See CONTRIBUTING.md → "Running tests".
      # Runner images rotate their simulator models, so pick an iPhone from the newest
      # installed iOS runtime instead of naming one.
      - name: Run Tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | contains("SimRuntime.iOS")))
            | map(.value |= map(select(.name | startswith("iPhone"))))
            | map(select(.value | length > 0))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | last.value | first | .udid // empty')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          xcodebuild test \
            -project build-project/DashX.xcodeproj \
            -scheme DashXTests \
            -destination "id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
